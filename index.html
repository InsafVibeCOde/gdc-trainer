<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<title>GDC Trainer</title>

<style>
:root{
  --bg:#070709; --surface:#111114; --surface2:#17171b; --surface3:#1d1d22;
  --line:rgba(255,255,255,.075); --line2:rgba(255,28,38,.28);
  --red:#ff202b; --red-dark:#b80710; --red-soft:rgba(255,31,42,.11);
  --text:#f7f7f8; --muted:#96969f; --green:#36d391; --yellow:#f3c34e; --danger:#ff5963;
}
*{box-sizing:border-box}
html,body{margin:0;background:#050506;color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
body{min-height:100vh}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{
  max-width:520px;margin:0 auto;min-height:100vh;
  background:
   radial-gradient(80% 24% at 50% -4%,rgba(255,28,38,.23),transparent 72%),
   radial-gradient(90% 45% at 0% 40%,rgba(255,0,0,.045),transparent 70%),
   var(--bg);
}
header{
  padding:16px 18px 10px;position:sticky;top:0;z-index:10;
  background:rgba(7,7,9,.78);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(255,255,255,.04)
}
.logo{width:124px;height:auto;display:block;margin:0 auto 13px;filter:drop-shadow(0 6px 18px rgba(255,0,0,.24))}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.title{font-size:27px;font-weight:900;letter-spacing:-.8px}
.subtitle{color:var(--muted);font-size:12px;margin-top:3px}
.iconbtn{
  width:42px;height:42px;border-radius:14px;border:1px solid var(--line);
  background:rgba(255,255,255,.045);color:#fff;font-size:23px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04)
}
main{padding:14px 15px 108px}
.hero{
  padding:18px;border-radius:23px;position:relative;overflow:hidden;
  background:linear-gradient(140deg,rgba(255,22,31,.18),rgba(255,22,31,.035) 47%,rgba(255,255,255,.018));
  border:1px solid rgba(255,42,50,.22);box-shadow:0 15px 38px rgba(0,0,0,.28)
}
.hero:after{
  content:"";position:absolute;width:180px;height:180px;border-radius:50%;
  right:-72px;top:-86px;background:radial-gradient(circle,rgba(255,25,35,.3),transparent 68%)
}
.eyebrow{text-transform:uppercase;color:#ff6169;font-size:10px;font-weight:900;letter-spacing:1.5px}
.hero h1{font-size:28px;margin:5px 0 4px;letter-spacing:-.8px}
.hero p{margin:0;color:#b6b6bc;font-size:13px;line-height:1.45;max-width:280px}
.hero .heroBtns{display:flex;gap:8px;margin-top:15px}
.btn{
  border:0;border-radius:14px;padding:12px 15px;font-weight:850;color:#fff;
  background:linear-gradient(180deg,#ff313a,#d70e17);
  box-shadow:0 9px 20px rgba(255,22,31,.2), inset 0 1px 0 rgba(255,255,255,.16)
}
.btn.secondary{
  background:rgba(255,255,255,.045);border:1px solid var(--line);box-shadow:none
}
.btn.small{padding:9px 11px;font-size:12px}
.full{width:100%}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.section{margin-top:15px}
.section h2{font-size:12px;text-transform:uppercase;letter-spacing:1px;margin:0 0 9px;color:#c6c6cb}
.stat{
  padding:14px;border-radius:17px;background:rgba(255,255,255,.035);
  border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.025)
}
.stat b{display:block;font-size:24px;letter-spacing:-.7px}
.stat span{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.kpis{display:flex;gap:8px;overflow:auto;padding-bottom:2px}.kpi{min-width:126px}
.search{
  width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);
  background:rgba(255,255,255,.035);color:#fff;outline:none
}
.search::placeholder,input::placeholder,textarea::placeholder{color:#717179}
.search:focus,input:focus,select:focus,textarea:focus{border-color:rgba(255,30,40,.55);box-shadow:0 0 0 3px rgba(255,30,40,.09)}
.group{
  padding:15px;margin-bottom:9px;border-radius:18px;
  background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.022));
  border:1px solid var(--line);box-shadow:0 10px 22px rgba(0,0,0,.15)
}
.group .name{font-weight:850;font-size:15px}.group .meta{color:var(--muted);font-size:11px;margin-top:4px}
.arrow{color:#ff4b53;font-size:23px}
.person{
  display:flex;align-items:center;gap:11px;padding:12px;margin-bottom:8px;
  border-radius:17px;background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.02));
  border:1px solid var(--line);box-shadow:0 8px 20px rgba(0,0,0,.13)
}
.avatar{
  width:45px;height:45px;flex:0 0 45px;border-radius:15px;display:grid;place-items:center;
  background:linear-gradient(145deg,#342024,#161619);border:1px solid rgba(255,53,63,.32);
  color:#fff;font-weight:900
}
.person .name{font-weight:850;font-size:14px}.person .meta{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{padding:7px 9px;border-radius:10px;font-size:10px;font-weight:900;white-space:nowrap}
.ok{background:rgba(54,211,145,.11);color:var(--green)}
.soon{background:rgba(243,195,78,.11);color:var(--yellow)}
.late{background:rgba(255,89,99,.11);color:var(--danger)}
.card{
  background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.02));
  border:1px solid var(--line);border-radius:20px;padding:15px;box-shadow:0 12px 26px rgba(0,0,0,.18)
}
.detailHero{display:flex;align-items:center;gap:12px}
.bigavatar{
  width:66px;height:66px;border-radius:20px;display:grid;place-items:center;
  background:radial-gradient(circle at 30% 20%,#452129,#17171a 65%);border:1px solid rgba(255,40,49,.35);
  font-size:23px;font-weight:950
}
.price{font-size:17px;font-weight:900}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:11px;color:#8d8d95;margin:0 0 6px;font-weight:700}
.field{margin-bottom:10px}
input,select,textarea{
  width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:14px;
  background:rgba(255,255,255,.035);color:#fff;outline:none
}
textarea{min-height:88px;resize:vertical}
.back{display:flex;align-items:center;gap:7px;color:#ff454e;border:0;background:none;padding:0;font-weight:850;margin-bottom:12px}
.empty{
  padding:28px 15px;text-align:center;color:var(--muted);
  border:1px dashed #303036;border-radius:17px;background:rgba(255,255,255,.018)
}
.notice{font-size:12px;color:var(--muted);line-height:1.45}
.history{margin-top:10px}.payrow{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.06);display:flex;justify-content:space-between;gap:10px}
.payrow:last-child{border-bottom:0}
.smallmuted{font-size:11px;color:var(--muted)}
hr{border:0;border-top:1px solid rgba(255,255,255,.07);margin:14px 0}
.tabs{
  position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(520px,100%);
  display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:8px 9px max(9px,env(safe-area-inset-bottom));
  background:rgba(9,9,11,.9);border-top:1px solid rgba(255,255,255,.06);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);z-index:20
}
.tab{
  border:0;background:transparent;color:#6e6e75;padding:7px 4px;border-radius:13px;font-size:10px;font-weight:700
}
.tab.active{color:#ff3540;background:rgba(255,25,35,.09)}
.tab b{display:block;font-size:19px;line-height:18px;margin-bottom:5px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-end;z-index:50}
.modal.open{display:flex}
.sheet{
  width:min(520px,100%);margin:0 auto;background:#111114;border:1px solid #2a2a2f;border-bottom:0;
  border-radius:24px 24px 0 0;padding:19px 16px max(22px,env(safe-area-inset-bottom));max-height:88vh;overflow:auto;
  box-shadow:0 -20px 60px rgba(0,0,0,.5)
}
.sheet h3{margin:0 0 15px;font-size:20px;letter-spacing:-.3px}
.toast{
  position:fixed;left:50%;bottom:89px;transform:translateX(-50%) translateY(15px);opacity:0;pointer-events:none;
  background:#f2f2f3;color:#111;padding:10px 14px;border-radius:12px;font-weight:800;font-size:12px;z-index:100;transition:.22s;
  box-shadow:0 10px 25px rgba(0,0,0,.3)
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:370px){.formgrid{grid-template-columns:1fr}}
</style>


<style>
#lockScreen{
  position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;
  padding:24px;background:
  radial-gradient(80% 40% at 50% 0%,rgba(255,24,34,.2),transparent 70%),#070709;
}
.lockBox{
  width:min(380px,100%);padding:28px 20px;border-radius:26px;text-align:center;
  background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.025));
  border:1px solid rgba(255,255,255,.08);box-shadow:0 25px 70px rgba(0,0,0,.48);
}
.lockLogo{width:145px;max-width:70%;margin:0 auto 18px;display:block;filter:drop-shadow(0 7px 22px rgba(255,0,0,.28))}
.lockTitle{font-size:26px;font-weight:950;letter-spacing:-.6px}
.lockSub{margin:6px 0 18px;color:#9898a0;font-size:12px;line-height:1.45}
.lockError{min-height:17px;margin:8px 0 0;color:#ff6971;font-size:11px;font-weight:750}
.lockRemember{
  display:flex;align-items:center;justify-content:center;gap:8px;margin:12px 0 15px;
  color:#8f8f97;font-size:11px
}
.lockRemember input{width:16px;height:16px;accent-color:#ff202b}
</style>

<script>
const KEY='gdc_trainer_v1';
let db=JSON.parse(localStorage.getItem(KEY)||'null') || {groups:[], children:[], payments:[]};
let currentGroup=null,currentChild=null;
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmt(d){if(!d)return '—'; return new Date(d+'T12:00:00').toLocaleDateString('ru-RU')}
function daysUntil(d){
  if(!d) return null;
  const now=new Date(); now.setHours(0,0,0,0);
  const target=new Date(d+'T00:00:00');
  return Math.ceil((target-now)/86400000);
}
function statusFor(d){
  const n=daysUntil(d);
  if(n===null) return ['Нет даты','soon'];
  if(n<0) return [`Просрочено ${Math.abs(n)} дн.`,'late'];
  if(n<=7) return [`Через ${n} дн.`,'soon'];
  return [`Через ${n} дн.`,'ok'];
}
function groupChildren(gid){return db.children.filter(x=>x.groupId===gid)}
function totalGroup(gid){return groupChildren(gid).length}
function nextPayment(c){return c.nextPayment||null}
function initials(name){
  const a=String(name||'').trim().split(/\s+/);
  return (a[0]?.[0]||'?')+(a[1]?.[0]||'');
}
function setHeader(title,sub){document.getElementById('pageTitle').textContent=title;document.getElementById('pageSubtitle').textContent=sub}
function setActive(tab){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab))}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}
function go(tab){
  currentGroup=null; currentChild=null;
  setActive(tab);
  if(tab==='home') 
const ACCESS_KEY='gdc_trainer_access_v1';
const ACCESS_PASSWORD='GDC2026'; // Поменяй пароль здесь перед публикацией.
function unlockApp(){
  const val=document.getElementById('lockPassword').value;
  const err=document.getElementById('lockError');
  if(val===ACCESS_PASSWORD){
    if(document.getElementById('lockRemember').checked) localStorage.setItem(ACCESS_KEY,'1');
    document.getElementById('lockScreen').style.display='none';
    err.textContent='';
  }else{
    err.textContent='Неверный пароль';
    document.getElementById('lockPassword').value='';
    document.getElementById('lockPassword').focus();
  }
}
function initLock(){
  if(localStorage.getItem(ACCESS_KEY)==='1'){
    document.getElementById('lockScreen').style.display='none';
  }else{
    setTimeout(()=>document.getElementById('lockPassword')?.focus(),120);
  }
}

renderHome();
initLock();
  if(tab==='groups') renderGroups();
  if(tab==='payments') renderPayments();
}
function renderHome(){
 setHeader('Обзор', `${db.groups.length} ${plural(db.groups.length,'группа','группы','групп')} · ${db.children.length} ${plural(db.children.length,'ребёнок','ребёнка','детей')}`);
 const due=db.children.filter(c=>c.nextPayment && daysUntil(c.nextPayment)<=7);
 const overdue=db.children.filter(c=>c.nextPayment && daysUntil(c.nextPayment)<0);
 document.getElementById('screen').innerHTML=`
  <div class="hero">
    <div class="eyebrow">GDC TRAINER</div>
    <h1>Всё под контролем.</h1>
    <p>Группы, дети и оплаты — в одном месте, без лишних экранов.</p>
    <div class="heroBtns">
      <button class="btn" onclick="showGroupForm()">＋ Группа</button>
      ${db.groups.length?`<button class="btn secondary" onclick="showChildForm('${db.groups[0].id}')">＋ Ребёнок</button>`:''}
    </div>
  </div>
  <div class="section grid">
    <div class="stat"><b>${db.groups.length}</b><span>Групп</span></div>
    <div class="stat"><b>${db.children.length}</b><span>Детей</span></div>
    <div class="stat"><b>${due.length}</b><span>Оплата скоро</span></div>
    <div class="stat"><b>${overdue.length}</b><span>Просрочено</span></div>
  </div>
  <div class="section"><div class="row"><h2 style="margin:0">Требует внимания</h2><button class="btn secondary small" onclick="go('payments')">Все оплаты</button></div>
   ${due.length?due.slice(0,6).map(paymentLine).join(''):'<div class="empty">Пока всё спокойно 👌</div>'}
  </div>
  <div class="section"><h2>Группы</h2>
   ${db.groups.length?db.groups.slice(0,5).map(groupCard).join(''):'<div class="empty">Создай первую группу и добавь детей.</div>'}
  </div>`;
}
function groupCard(g){
  return `<div class="group" onclick="openGroup('${g.id}')">
    <div class="row"><div><div class="name">${esc(g.name)}</div><div class="meta">${totalGroup(g.id)} ${plural(totalGroup(g.id),'участник','участника','участников')}</div></div><div class="arrow">›</div></div>
  </div>`
}
function paymentLine(c){
 const g=db.groups.find(g=>g.id===c.groupId); const [txt,cl]=statusFor(c.nextPayment);
 return `<div class="person" onclick="openChild('${c.id}')">
   <div class="avatar">${esc(initials(c.name))}</div>
   <div style="flex:1;min-width:0"><div class="name">${esc(c.name)}</div><div class="meta">${esc(g?.name||'Без группы')} · ${fmt(c.nextPayment)}</div></div>
   <div class="badge ${cl}">${esc(txt)}</div>
 </div>`
}
function renderGroups(){
 setHeader('Группы', `${db.groups.length} ${plural(db.groups.length,'группа','группы','групп')}`);
 document.getElementById('screen').innerHTML=`
 <div class="row" style="margin-bottom:10px"><input class="search" id="gsearch" placeholder="Поиск группы..." oninput="filterGroups()"><button class="iconbtn" style="margin-left:8px" onclick="showGroupForm()">＋</button></div>
 <div id="glist">${db.groups.length?db.groups.map(groupCard).join(''):'<div class="empty">Групп ещё нет.</div>'}</div>`;
}
function filterGroups(){
 const q=document.getElementById('gsearch').value.toLowerCase();
 document.getElementById('glist').innerHTML=db.groups.filter(g=>g.name.toLowerCase().includes(q)).map(groupCard).join('')||'<div class="empty">Ничего не найдено.</div>';
}
function openGroup(gid){
 currentGroup=gid; setActive('groups');
 const g=db.groups.find(x=>x.id===gid); const kids=groupChildren(gid);
 setHeader(g.name,`${kids.length} ${plural(kids.length,'участник','участника','участников')}`);
 document.getElementById('screen').innerHTML=`
 <button class="back" onclick="renderGroups()">← Все группы</button>
 <div class="card">
  <div class="row"><div><div style="font-size:19px;font-weight:850">${esc(g.name)}</div><div class="smallmuted">${esc(g.note||'Без описания')}</div></div>
   <button class="iconbtn" onclick="showGroupForm('${gid}')">✎</button>
  </div>
  <div class="section"><button class="btn full" onclick="showChildForm('${gid}')">＋ Добавить ребёнка</button></div>
 </div>
 <div class="section"><input class="search" id="csearch" placeholder="Поиск по детям..." oninput="filterChildren('${gid}')"></div>
 <div class="section"><h2>Дети</h2><div id="clist">${kids.length?kids.map(childCard).join(''):'<div class="empty">В этой группе пока никого нет.</div>'}</div></div>`;
}
function childCard(c){
 const [txt,cl]=statusFor(c.nextPayment);
 return `<div class="person" onclick="openChild('${c.id}')">
  <div class="avatar">${esc(initials(c.name))}</div>
  <div style="flex:1;min-width:0"><div class="name">${esc(c.name)}</div><div class="meta">${c.age?esc(c.age)+' лет · ':''}${c.monthly?esc(c.monthly)+' ₽ · ':''}${c.nextPayment?'след. оплата '+fmt(c.nextPayment):'дата оплаты не указана'}</div></div>
  <div class="badge ${cl}">${esc(txt)}</div>
 </div>`
}
function filterChildren(gid){
 const q=document.getElementById('csearch').value.toLowerCase();
 document.getElementById('clist').innerHTML=groupChildren(gid).filter(c=>c.name.toLowerCase().includes(q)).map(childCard).join('')||'<div class="empty">Ничего не найдено.</div>';
}
function openChild(cid){
 currentChild=cid;
 const c=db.children.find(x=>x.id===cid); const g=db.groups.find(x=>x.id===c.groupId);
 setHeader(c.name, g?.name||'Карточка ребёнка');
 const [txt,cl]=statusFor(c.nextPayment);
 const hist=db.payments.filter(p=>p.childId===cid).sort((a,b)=>b.date.localeCompare(a.date));
 document.getElementById('screen').innerHTML=`
 <button class="back" onclick="openGroup('${c.groupId}')">← ${esc(g?.name||'Группа')}</button>
 <div class="card">
   <div class="detailHero">
    <div class="bigavatar">${esc(initials(c.name))}</div>
    <div style="flex:1"><div style="font-size:21px;font-weight:900">${esc(c.name)}</div><div class="smallmuted">${c.age?esc(c.age)+' лет':''}</div></div>
    <button class="iconbtn" onclick="showChildForm('${c.groupId}','${c.id}')">✎</button>
   </div>
   <hr>
   <div class="grid">
    <div class="stat"><b>${c.monthly?esc(c.monthly)+' ₽':'—'}</b><span>Сумма</span></div>
    <div class="stat"><b class="${cl==='late'?'':''}">${esc(txt)}</b><span>До следующей оплаты</span></div>
   </div>
   <div class="section"><button class="btn full" onclick="showPaymentForm('${c.id}')">＋ Зафиксировать оплату</button></div>
 </div>
 <div class="section"><h2>Последние оплаты</h2>
  <div class="card history">${hist.length?hist.slice(0,10).map(p=>`<div class="payrow"><div><b>${fmt(p.date)}</b><div class="smallmuted">${p.period} дн. · следующая ${fmt(p.nextDate)}</div></div><div class="price">${esc(p.amount)} ₽</div></div>`).join(''):'<div class="empty">Истории оплаты ещё нет.</div>'}</div>
 </div>
 ${c.note?`<div class="section"><h2>Заметка</h2><div class="card">${esc(c.note)}</div></div>`:''}
 <div class="section"><button class="btn secondary full" onclick="deleteChild('${c.id}')">Удалить ребёнка</button></div>`;
}
function renderPayments(){
 setHeader('Оплаты','Контроль ближайших платежей');
 const sorted=[...db.children].sort((a,b)=>(daysUntil(a.nextPayment)??9999)-(daysUntil(b.nextPayment)??9999));
 document.getElementById('screen').innerHTML=`
 <div class="kpis">
  <div class="stat kpi"><b>${db.children.filter(c=>c.nextPayment&&daysUntil(c.nextPayment)<0).length}</b><span>Просрочено</span></div>
  <div class="stat kpi"><b>${db.children.filter(c=>c.nextPayment&&daysUntil(c.nextPayment)>=0&&daysUntil(c.nextPayment)<=7).length}</b><span>≤ 7 дней</span></div>
  <div class="stat kpi"><b>${db.children.filter(c=>!c.nextPayment).length}</b><span>Нет даты</span></div>
 </div>
 <div class="section"><input class="search" placeholder="Поиск ребёнка..." id="psearch" oninput="filterPayments()"></div>
 <div class="section"><div id="plist">${sorted.length?sorted.map(paymentLine).join(''):'<div class="empty">Пока нет детей.</div>'}</div></div>`;
}
function filterPayments(){
 const q=document.getElementById('psearch').value.toLowerCase();
 const list=db.children.filter(c=>c.name.toLowerCase().includes(q)).sort((a,b)=>(daysUntil(a.nextPayment)??9999)-(daysUntil(b.nextPayment)??9999));
 document.getElementById('plist').innerHTML=list.map(paymentLine).join('')||'<div class="empty">Ничего не найдено.</div>';
}
function showModal(html){document.getElementById('sheet').innerHTML=html;document.getElementById('modal').classList.add('open')}
function closeModal(e){if(e.target.id==='modal') document.getElementById('modal').classList.remove('open')}
function hideModal(){document.getElementById('modal').classList.remove('open')}
function showQuickAdd(){
 showModal(`<h3>Добавить</h3><button class="btn full" onclick="hideModal();showGroupForm()">＋ Новую группу</button><div style="height:9px"></div>${db.groups.length?'<button class="btn secondary full" onclick="hideModal();showChildForm(\''+db.groups[0].id+'\')">＋ Ребёнка</button>':''}`);
}
function showGroupForm(gid){
 const g=gid?db.groups.find(x=>x.id===gid):null;
 showModal(`<h3>${g?'Изменить группу':'Новая группа'}</h3>
  <div class="field"><label>Название группы</label><input id="f_gname" value="${esc(g?.name||'')}" placeholder="Например: Дети 8–10 лет"></div>
  <div class="field"><label>Заметка</label><textarea id="f_gnote" placeholder="День недели, время и т.д.">${esc(g?.note||'')}</textarea></div>
  <button class="btn full" onclick="saveGroup('${gid||''}')">${g?'Сохранить':'Создать группу'}</button>
  ${g?`<div style="height:9px"></div><button class="btn secondary full" onclick="deleteGroup('${gid}')">Удалить группу</button>`:''}`);
}
function saveGroup(gid){
 const name=document.getElementById('f_gname').value.trim();
 if(!name)return toast('Введи название группы');
 const note=document.getElementById('f_gnote').value.trim();
 if(gid){const g=db.groups.find(x=>x.id===gid);g.name=name;g.note=note}else db.groups.push({id:uid('g'),name,note});
 save();hideModal();toast(gid?'Группа сохранена':'Группа создана'); gid?openGroup(gid):go('groups');
}
function deleteGroup(gid){
 if(!confirm('Удалить группу и всех её детей?'))return;
 db.groups=db.groups.filter(g=>g.id!==gid);
 db.children=db.children.filter(c=>c.groupId!==gid);
 db.payments=db.payments.filter(p=>db.children.some(c=>c.id===p.childId));
 save();hideModal();toast('Группа удалена');go('groups');
}
function showChildForm(gid,cid){
 const c=cid?db.children.find(x=>x.id===cid):null;
 showModal(`<h3>${c?'Изменить ребёнка':'Добавить ребёнка'}</h3>
  <div class="field"><label>Имя и фамилия</label><input id="f_cname" value="${esc(c?.name||'')}" placeholder="Например: Артём Иванов"></div>
  <div class="formgrid">
   <div class="field"><label>Возраст</label><input id="f_cage" inputmode="numeric" value="${esc(c?.age||'')}" placeholder="9"></div>
   <div class="field"><label>Сумма оплаты, ₽</label><input id="f_camount" inputmode="decimal" value="${esc(c?.monthly||'')}" placeholder="3000"></div>
  </div>
  <div class="formgrid">
   <div class="field"><label>Следующая оплата</label><input id="f_cnext" type="date" value="${esc(c?.nextPayment||'')}"></div>
   <div class="field"><label>Период, дней</label><input id="f_cperiod" inputmode="numeric" value="${esc(c?.period||30)}"></div>
  </div>
  <div class="field"><label>Заметка</label><textarea id="f_cnote" placeholder="Технические заметки тренера">${esc(c?.note||'')}</textarea></div>
  <button class="btn full" onclick="saveChild('${gid}','${cid||''}')">${c?'Сохранить':'Добавить'}</button>
  ${c?`<div style="height:9px"></div><button class="btn secondary full" onclick="deleteChild('${c.id}')">Удалить ребёнка</button>`:''}`);
}
function saveChild(gid,cid){
 const name=document.getElementById('f_cname').value.trim();
 if(!name)return toast('Введи имя');
 const data={name,age:document.getElementById('f_cage').value.trim(),monthly:document.getElementById('f_camount').value.trim(),nextPayment:document.getElementById('f_cnext').value,period:parseInt(document.getElementById('f_cperiod').value||30),note:document.getElementById('f_cnote').value.trim()};
 if(cid){Object.assign(db.children.find(c=>c.id===cid),data)}
 else {db.children.push({id:uid('c'),groupId:gid,...data})}
 save();hideModal();toast(cid?'Сохранено':'Ребёнок добавлен');openGroup(gid);
}
function deleteChild(cid){
 if(!confirm('Удалить ребёнка и историю его оплат?'))return;
 const c=db.children.find(x=>x.id===cid);db.children=db.children.filter(x=>x.id!==cid);db.payments=db.payments.filter(p=>p.childId!==cid);
 save();hideModal();toast('Удалено');openGroup(c.groupId);
}
function showPaymentForm(cid){
 const c=db.children.find(x=>x.id===cid);
 const today=new Date().toISOString().slice(0,10);
 showModal(`<h3>Новая оплата</h3>
   <div class="notice" style="margin-bottom:11px">Для ${esc(c.name)}</div>
   <div class="formgrid">
    <div class="field"><label>Дата оплаты</label><input id="f_pdate" type="date" value="${today}"></div>
    <div class="field"><label>Сумма, ₽</label><input id="f_pamount" inputmode="decimal" value="${esc(c.monthly||'')}"></div>
   </div>
   <div class="field"><label>Период, дней</label><input id="f_pperiod" inputmode="numeric" value="${esc(c.period||30)}"></div>
   <button class="btn full" onclick="savePayment('${cid}')">Сохранить оплату</button>`);
}
function addDays(dateStr,n){const d=new Date(dateStr+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function savePayment(cid){
 const c=db.children.find(x=>x.id===cid);
 const date=document.getElementById('f_pdate').value;
 const amount=document.getElementById('f_pamount').value.trim();
 const period=parseInt(document.getElementById('f_pperiod').value||30);
 if(!date||!amount||!period)return toast('Заполни дату, сумму и период');
 const next=addDays(date,period);
 db.payments.push({id:uid('p'),childId:cid,date,amount,period,nextDate:next});
 c.nextPayment=next;c.monthly=amount;c.period=period;
 save();hideModal();toast('Оплата сохранена');openChild(cid);
}
function plural(n,a,b,c){n=Math.abs(n)%100;const x=n%10;return n>10&&n<20?c:x===1?a:x>=2&&x<=4?b:c}
renderHome();
</script>
</body>
</html>
